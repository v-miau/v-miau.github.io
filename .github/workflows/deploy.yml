name: Deploy TrialRatingSite to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4

      - name: Check out TrialRatingSite
        uses: actions/checkout@v4
        with:
          repository: v-miau/TrialRatingSite
          ref: fix/github-pages-thumbnails
          path: trial-rating-site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trial-rating-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: trial-rating-site

      - name: Build website
        run: npm run build
        working-directory: trial-rating-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./trial-rating-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
